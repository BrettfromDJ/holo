# Builds and tests the iOS app on a GitHub-hosted Mac whenever ios/ changes.
# No signing here: this only proves the code compiles and the tests pass.
name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          # Placeholder values: enough to compile, nothing real.
          cp Config.xcconfig.example Config.xcconfig
          xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      # Compile first, on its own, so a build error shows up plainly and quickly.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Holo.xcodeproj -scheme Holo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep --line-buffered -E "error:|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build.log
      # Then run the tests, with a time limit so a stuck simulator fails fast instead of hanging.
      - name: Test
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcodebuild test-without-building \
            -project Holo.xcodeproj -scheme Holo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep --line-buffered -E "error:|Test Case|Test Suite|\*\* TEST" || true
          grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" test.log || grep -q "\*\* TEST SUCCEEDED \*\*" test.log
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            ios/build.log
            ios/test.log
