# Builds and tests the iOS app on a GitHub-hosted Mac whenever ios/ changes.
# No signing here: this only proves the code compiles and the tests pass.
name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

# Lets the screenshot step publish its pictures to the ci-screenshots branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          # Placeholder values: enough to compile, nothing real.
          cp Config.xcconfig.example Config.xcconfig
          xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      # Compile first, on its own, so a build error shows up plainly and quickly.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Holo.xcodeproj -scheme Holo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep --line-buffered -E "error:|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build.log
      # Then run the tests, with a time limit so a stuck simulator fails fast instead of hanging.
      - name: Test
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcodebuild test-without-building \
            -project Holo.xcodeproj -scheme Holo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:HoloTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep --line-buffered -E "error:|Test Case|Test Suite|\*\* TEST" || true
          grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" test.log || grep -q "\*\* TEST SUCCEEDED \*\*" test.log
      # Opens the app in demo mode on each main screen and saves screenshots, so changes can be
      # looked at, not just compiled. Pictures only: this step never fails the build.
      - name: Screenshots
        timeout-minutes: 12
        continue-on-error: true
        run: |
          mkdir -p screenshots
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild test-without-building \
            -project Holo.xcodeproj -scheme Holo \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:HoloUITests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee ui.log | grep --line-buffered -E "error:|Test Case|\*\* TEST" || true
          ls -la screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/screenshots
          if-no-files-found: warn
      # Also publish them (scaled down) to the ci-screenshots branch, one folder per commit,
      # replacing the branch each time so it stays small.
      - name: Publish screenshots
        if: always() && github.event_name == 'push'
        continue-on-error: true
        run: |
          [ -n "$(ls screenshots 2>/dev/null)" ] || exit 0
          for f in screenshots/*.png; do sips -Z 1000 "$f" >/dev/null; done
          OUT=$(mktemp -d)
          mkdir -p "$OUT/${GITHUB_SHA::7}"
          cp screenshots/*.png "$OUT/${GITHUB_SHA::7}/"
          cd "$OUT"
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            ios/build.log
            ios/test.log
            ios/ui.log
