# Xcode project definition. Generate Holo.xcodeproj with `xcodegen` (see README.md).
name: Holo
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
targets:
  Holo:
    type: application
    platform: iOS
    sources:
      - Holo
    dependencies:
      - package: Supabase
        product: Supabase
    postBuildScripts:
      # Every build gets a fresh, always-increasing build number (UTC date and time, e.g. 202610300415),
      # so TestFlight never rejects an upload for reusing one.
      - name: Set build number
        basedOnDependencyAnalysis: false
        script: |
          BUILD=$(date -u +%Y%m%d%H%M)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          echo "Build number $BUILD"
    entitlements:
      path: Holo/Holo.entitlements
      properties:
        # Xcode switches this to production when exporting for TestFlight.
        aps-environment: development
    info:
      path: Holo/Info.plist
      properties:
        CFBundleDisplayName: Lucent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # Geist and Anton, the website's typefaces (Resources/Fonts, SIL Open Font License).
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - RobotoMono-Regular.ttf
          - RobotoMono-Medium.ttf
          - Anton-Regular.ttf
        NSCameraUsageDescription: Holo uses the camera to scan your cards and look up their prices, and to photograph deals.
        ITSAppUsesNonExemptEncryption: false
        # Read by AppConfig.swift; values come from Config.xcconfig.
        HoloAPIHost: $(HOLO_API_HOST)
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HOLO_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(HOLO_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # The build-number script edits the built Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  HoloTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HoloTests
    dependencies:
      - target: Holo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HOLO_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(HOLO_TEAM_ID)
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  HoloUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HoloUITests
    dependencies:
      - target: Holo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HOLO_BUNDLE_ID).uitests
        DEVELOPMENT_TEAM: $(HOLO_TEAM_ID)
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Holo
schemes:
  Holo:
    build:
      targets:
        Holo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HoloTests
        - HoloUITests
    archive:
      config: Release
